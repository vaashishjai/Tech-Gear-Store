<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Gear Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tech Gear</h1>
        <h4>Home</h4>
        <h4>Contact</h4>
    </header>

    <div id="content">
        <div class="inline">
            <input class="checkbox" type="checkbox" onclick="toPage('macbook', this)">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400" alt="MacBook Air">
            <input class="textbox" type="text" placeholder="Quantity">
        </div>
        <div class="inline">
            <input class="checkbox" type="checkbox" onclick="toPage('keyboard', this)">
            <img src="https://images.unsplash.com/photo-1595225476474-87563907a212?w=400" alt="Redragon Keyboard">
            <input class="textbox" type="text" placeholder="Quantity">
        </div>
        <div class="inline">
            <input class="checkbox" type="checkbox" onclick="toPage('ipad', this)">
            <img src="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=400" alt="iPad">
            <input class="textbox" type="text" placeholder="Quantity">
        </div>        
    </div>

    <script src="script.js"></script>
</body>
</html>
